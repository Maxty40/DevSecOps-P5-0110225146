name: DevSecOps CI/CD Pipeline with SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================================
  # JOB 1: Build, Dependency Audit, and Unit Testing
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit (SCA)
        run: npm audit --audit-level=moderate || true

      - name: Run Tests with Coverage
        run: npm test

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================================
  # JOB 2: SAST Security Scan with SonarCloud
  # ==========================================================
  sast-scan:
    name: SAST Scan (SonarCloud)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Diperlukan untuk analisis git blame dan history di SonarCloud

      - name: Download Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Run SonarCloud SAST Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
