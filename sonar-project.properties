# ====================================================================
# Konfigurasi SonarCloud (SAST) - DevSecOps
# Ganti nilai <YOUR_PROJECT_KEY> dan <YOUR_ORGANIZATION_KEY> sesuai
# dashboard akun SonarCloud Anda (https://sonarcloud.io).
# ====================================================================

# Kunci unik proyek di SonarCloud
sonar.projectKey=Maxty40_DevSecOps-P5-0110225146

# Kunci organisasi Anda di SonarCloud
sonar.organization=maxty40

# Nama proyek yang akan ditampilkan pada dashboard SonarCloud
sonar.projectName=devsecops-ci-cd-pipeline

# Target host SonarCloud
sonar.host.url=https://sonarcloud.io

# Lokasi source code dan unit test
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Format dan lokasi laporan code coverage (LCOV) dari Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Pengecualian dari scanning dan coverage
sonar.exclusions=node_modules/**,coverage/**
sonar.coverage.exclusions=tests/**,node_modules/**,src/server.js

# Encoding karakter
sonar.sourceEncoding=UTF-8

